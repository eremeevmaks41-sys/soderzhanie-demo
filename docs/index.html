<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>Оглавление</title>
<!-- ═════════════════════════════════════════════════════════════════
     «Оглавление телеграм-канала» · мини-апп
     Одна страница, без внешних зависимостей. Хостинг: GitHub Pages.
     Данные: docs/posts.json (обновляется автоматически Actions).
     Настройки: docs/config.js  (канал, цвет, лицензия).
     ═════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --card2:#f1ead9; --text:#2b2417; --muted:#8a7f68;
  --accent:#9a6b15; --accent-soft:#efe2c6; --chip:#efe8d8; --chip-active:#9a6b15;
  --chip-active-text:#fffdf8; --line:#e6dcc4; --search:#fffdf8; --shadow:0 2px 10px rgba(80,60,20,.07);
}
html[data-theme="dark"]{
  --bg:#1c1a16; --card:#26231d; --card2:#2e2a22; --text:#ece5d5; --muted:#9a917d;
  --accent:#d8b25e; --accent-soft:#3a3428; --chip:#2e2a22; --chip-active:#d8b25e;
  --chip-active-text:#1c1a16; --line:#3a352b; --search:#26231d; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}

/* ── шапка ── */
header{display:flex;align-items:center;gap:12px;padding:10px 2px 14px}
.logo{
  width:46px;height:46px;border-radius:14px;flex:0 0 auto;
  background:var(--accent-soft);display:flex;align-items:center;justify-content:center;
  font-size:24px;user-select:none;
}
.h-name{font-size:19px;font-weight:700;letter-spacing:.1px}
.h-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.h-share{
  margin-left:auto;flex:0 0 auto;width:36px;height:36px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line);background:transparent;color:var(--accent);
  border-radius:11px;font-size:16px;line-height:1;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.h-share:active{background:var(--accent-soft);transform:scale(.94)}
.h-open{
  flex:0 0 auto;text-decoration:none;font-size:13px;font-weight:600;
  color:var(--accent);border:1.5px solid var(--accent);border-radius:11px;padding:7px 12px;
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.h-open:active{background:var(--accent-soft);transform:scale(.96)}

/* ── поиск ── */
.search{position:relative;margin-bottom:10px}
.search input{
  width:100%;padding:11px 38px 11px 38px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--search);color:var(--text);font-size:15px;outline:none;
}
.search input:focus{border-color:var(--accent)}
/* iOS рисует у type=search свой крестик — скрываем, у нас есть свой */
.search input{-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;font-size:15px}
.search .clr{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:var(--muted);font-size:17px;padding:6px 8px;cursor:pointer;display:none;
  transition:color .12s ease, transform .12s ease;
}
.search .clr:active{color:var(--accent);transform:translateY(-50%) scale(.88)}

/* ── темы (чипсы) ── */
.chips{
  display:flex;gap:7px;overflow-x:auto;padding:2px 2px 12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1.5px solid var(--line);background:var(--chip);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  user-select:none;-webkit-user-select:none;
  transition:transform .12s ease, border-color .12s ease, color .12s ease, background .12s ease;
}
.chip:active{transform:scale(.93)}
.chip.active{background:var(--chip-active);color:var(--chip-active-text);border-color:var(--chip-active)}

/* ── даты и карточки ── */
.day{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px}
.card{
  display:block;color:inherit;text-decoration:none; /* карточка — настоящая <a> */
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;
  transition:background .12s ease, transform .12s ease;
}
.card:active,.card.pressed{background:var(--card2);transform:scale(.985)}
.c-top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.c-time{font-size:12px;color:var(--muted);flex:0 0 auto}
.c-title{font-size:15.5px;font-weight:700;line-height:1.35}
.c-prev{font-size:13.8px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.c-tag{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:2.5px 8px;font-weight:600}

/* ── переключатель вида: Оглавление / Лента ── */
.views{display:flex;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-bottom:11px}
.views button{
  flex:1;border:0;background:transparent;color:var(--muted);
  font-size:13.5px;font-weight:700;padding:8px 0;border-radius:9px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:color .12s ease, background .12s ease;
}
.views button:active{color:var(--text)}
.views button.active{background:var(--chip-active);color:var(--chip-active-text)}

/* ── сетка карточек (корень оглавления и разделы) ── */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.tcard{
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:14px;cursor:pointer;box-shadow:var(--shadow);
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.tcard:active{background:var(--card2);transform:scale(.96)}
.t-ico{font-size:25px;line-height:1}
.t-title{font-size:14.5px;font-weight:700;margin-top:7px;line-height:1.3}
.t-n{font-size:12px;color:var(--muted);margin-top:3px}
.slabel{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:15px 2px 9px}
.tagwrap{display:flex;flex-wrap:wrap;gap:7px;margin:2px 2px 8px}
.back{
  display:block;width:100%;margin:2px 0 10px;padding:10px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--chip);color:var(--text);
  font-size:13.5px;font-weight:700;cursor:pointer;text-align:center;
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.back:active{background:var(--accent-soft);transform:scale(.98)}


/* ── состояния ── */
.more{
  display:block;width:100%;margin:14px 0 4px;padding:12px;border-radius:13px;
  border:1.5px dashed var(--accent);background:transparent;color:var(--accent);
  font-size:14.5px;font-weight:700;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:background .12s ease, transform .12s ease;
}
.more:active{background:var(--accent-soft);transform:scale(.98)}
.state{padding:46px 20px;text-align:center;color:var(--muted)}
.state .big{font-size:40px;margin-bottom:10px}
.state .t{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.banner{
  display:none;background:#fdeaea;color:#8a2020;border:1px solid #f2c4c4;border-radius:12px;
  padding:10px 13px;font-size:13px;margin-bottom:10px;
}
html[data-theme="dark"] .banner{background:#3a2424;color:#e8b0b0;border-color:#5a3434}
.banner a{color:inherit;font-weight:700;text-decoration:underline}

/* ── футер (водяной знак) ── */
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
footer b{color:var(--text);font-weight:600}
footer .lic{font-size:11px;opacity:.75}
</style>
<!-- ═══ МОСТ TELEGRAM — официальный и ОБЯЗАТЕЛЬНЫЙ ═══
     core.telegram.org/bots/webapps → «Initializing Mini Apps»:
     «To connect your Mini App to the Telegram client, place the script
     telegram-web-app.js in the <head> tag before any other scripts».
     Без него window.Telegram.WebApp НЕ создаётся — на iPhone tg=НЕТ:
     нет ни haptic, ни темы, ни openTelegramLink (корень бага
     «перехода нет» в версиях 52-e…52-l). Тот же скрипт подключён
     в head боевого MyRadio — и там переходы работают. ═══ -->
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">📖</div>
    <div>
      <div class="h-name" id="hName">Оглавление</div>
      <div class="h-sub" id="hSub">каталог постов канала</div>
    </div>
    <button class="h-share" id="hShare" type="button" aria-label="Скопировать ссылку на оглавление" title="Скопировать ссылку">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    </button>
    <a class="h-open" id="hOpen" href="#">Канал</a>
  </header>

  <div class="banner" id="banner"></div>

  <div class="search">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="Поиск по оглавлению…" autocomplete="off">
    <button class="clr" id="clr" aria-label="Очистить">✕</button>
  </div>

  <div class="views" id="views" style="display:none">
    <button id="vToc" type="button">📖 Оглавление</button>
    <button id="vFeed" type="button">🕘 Лента</button>
  </div>

  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div id="state" class="state" style="display:none"></div>

  <footer>
    <div><b>Оглавление</b> · каталог постов Telegram-канала · <span id="ver">v55</span></div>
    <div class="lic" id="licLine"></div>
  </footer>
</div>

<script src="config.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   «Оглавление телеграм-канала» · ядро мини-аппа
   Порядок работы: config.js → лицензия → posts.json → рендер.
   Править этот файл не нужно: всё настраивается в config.js.
   ══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

var SALT = 'SODERZHANIE-v1-7f3a';               // служебная соль лицензии
var PAGE_SIZE = 100;                            // карточек за одну подгрузку
var cfg = window.SZ_CONFIG || {};

/* ── Telegram WebApp: тема и открытие ссылок ──
   Официальный скрипт (см. <head>) создаёт window.Telegram.WebApp даже
   ВНЕ Telegram — но там это пустышка: в исходнике webAppVersion='6.0',
   webAppPlatform='unknown', postEvent уходит в никуда. Настоящий клиент
   всегда помечает мини-апп hash-параметрами tgWebApp* (tgWebAppPlatform,
   tgWebAppData, tgWebAppVersion…). Поэтому мостом считаем только
   настоящий контекст мини-аппа — иначе в обычном браузере ломаются
   фолбэки (лестница ниже подменялась бы мёртвыми вызовами). */
var rawTg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
var tg = null;
if (rawTg){
  var realBridge = (rawTg.platform && rawTg.platform !== 'unknown') ||
                   (rawTg.initData && String(rawTg.initData).length > 0) ||
                   /[?&#]tgWebApp/.test(window.location.href);
  tg = realBridge ? rawTg : null;
}
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

/* iOS Safari применяет :active только если на странице есть touchstart-обработчик */
document.addEventListener('touchstart', function(){}, {passive:true});

/* ── тактильный отклик: HapticFeedback есть в мобильном Telegram;
   в обычном браузере и на десктопе вызовы тихо игнорируются ── */
function haptic(style){
  if (tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
    try { tg.HapticFeedback.impactOccurred(style); } catch(e){}
  }
}
function hapticSelect(){
  if (tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged) {
    try { tg.HapticFeedback.selectionChanged(); } catch(e){}
  }
}
function hapticNotify(type){
  if (tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred) {
    try { tg.HapticFeedback.notificationOccurred(type); } catch(e){}
  }
}

/* ── нативная кнопка «Назад» Telegram: зеркалит внутреннюю «← …» ── */
var tgBackWired = false;
function wireTgBack(){
  if (!tg || !tg.BackButton || tgBackWired) return;
  tgBackWired = true;
  try {
    tg.onEvent('backButtonClicked', function(){
      var b = document.getElementById('backBtn');
      if (b && b.style.display !== 'none') b.click();
    });
  } catch(e){}
}
function updateTgBack(){
  if (!tg || !tg.BackButton || !tgBackWired) return;
  var b = document.getElementById('backBtn');
  var need = !!(b && b.style.display === 'block');
  try { if (need) tg.BackButton.show(); else tg.BackButton.hide(); } catch(e){}
}

/* ── тост + копирование ссылки (кнопка «поделиться») ── */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  if (!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));'
      + 'transform:translateX(-50%) translateY(8px);background:rgba(25,20,10,.88);color:#fff;'
      + 'font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;'
      + 'opacity:0;transition:opacity .18s ease, transform .18s ease;'
      + 'pointer-events:none;z-index:50;max-width:86%;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(8px)';
  }, 1900);
}
function legacyCopy(text){
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}
function copyText(text, done){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      function(){ done(true); },
      function(){ done(legacyCopy(text)); }
    );
  } else { done(legacyCopy(text)); }
}

function themeApply(){
  var p = (tg && tg.themeParams) || {};
  var dark = (tg && (p.bg_color ? isDark(p.bg_color) : (window.matchMedia('(prefers-color-scheme: dark)').matches)));
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  function isDark(hex){
    if (!hex) return false;
    var h = hex.replace('#','');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    return (0.299*r + 0.587*g + 0.114*b) < 128;
  }
}
/* шапка Telegram и фон под контентом красятся под тему приложения,
   meta theme-color — то же для обычного браузера */
function headerColorApply(){
  var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  var m = document.querySelector('meta[name="theme-color"]');
  if (m && bg) m.setAttribute('content', bg);
  if (tg && tg.setHeaderColor) { try { tg.setHeaderColor(bg); } catch(e){ try { tg.setHeaderColor('bg_color'); } catch(e2){} } }
  if (tg && tg.setBackgroundColor) { try { tg.setBackgroundColor(bg); } catch(e){} }
}
themeApply();
headerColorApply();
if (tg && tg.onEvent) { try { tg.onEvent('themeChanged', function(){ themeApply(); headerColorApply(); }); } catch(e){} }

/* iOS/iPadOS: переходы по target="_blank" и window.open во встроенном
   браузере Telegram на iPhone МОЛЧА БЛОКИРУЮТСЯ (WKWebView не умеет
   открывать новые вкладки) — единственный надёжный путь там: штатный
   API мини-аппа или переход в той же вкладке. */
var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '') ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); /* iPadOS 13+ маскируется под Mac */
/* ── ОТКРЫТИЕ ПОСТА — стратегия боевого приложения-оглавления MyRadio
   (канал «От чтения к Преображению»), проверена вживую на iOS 9.6 и
   Android 9.6 07.07.2026 (заметки из кода того проекта):

     Desktop Telegram → tg.openTelegramLink (открывает внутри Telegram)
     Telegram Web     → window.open (новая вкладка браузера)
     Мобильные        → tg.openTelegramLink: переход происходит сразу
                        в канал, мини-апп НЕ закрывается — Telegram сам
                        показывает канал поверх аппа, возврат свайпом
                        или системной кнопкой «Назад». Именно так это
                        предусматривает сам Телеграм для айфонов.

   Известная особенность iOS (наш случай «пост за аппом»): если мини-апп
   запущен ИЗ ТОГО ЖЕ канала, на пост которого ведёт ссылка (у нас —
   закреп с кнопкой оглавления), openTelegramLink НЕ делает видимого
   перехода — нет ни вибрации, ни сворачивания. При этом сама навигация
   в фоне происходит корректно. Отслеживается через visibilitychange:
   если за 1.5 с апп так и не свернулся — тихий случай, лечим его, как
   описано в блоке ниже (WebApp.close()). */
/* ── КОРЕНЬ БАГА «перехода нет» (52-e…52-l): в <head> не был подключён
   официальный telegram-web-app.js — единственный способ, которым клиент
   Telegram создаёт window.Telegram.WebApp. Без него на iPhone tg всегда
   НЕТ: haptic/тема/openTelegramLink не существуют, и ни одна стратегия
   ниже не запускалась никогда. С 52-m скрипт подключён в <head> —
   на iOS при входе через закреп/меню бота мост появляется (tg=есть).
   Подтверждение: head боевого MyRadio содержит тот же скрипт. */
/* ── строка самодиагностики в футере: фиксирует, в каком окружении
   открыта страница и какая ветка перехода реально сработала. По ней
   пользователь может точно сообщить, что происходит на его устройстве. */
var diagEl = null, diagLog = [];
function diagInit(){
  diagEl = document.createElement('div');
  diagEl.className = 'lic'; diagEl.id = 'diag';
  var f = document.querySelector('footer');
  if (f) f.appendChild(diagEl);
  diagNote('старт: tg=' + (tg
    ? 'есть · платформа=' + (tg.platform || '?') + ' · ver=' + (tg.version || '?')
    : (rawTg ? 'НЕТ (пустышка WebApp вне Telegram — игнорируем)' : 'НЕТ — обычная страница, моста нет')));
}
function diagNote(msg){
  if (!diagEl) return;
  var d = new Date(), z = function(x){ return ('0'+x).slice(-2); };
  diagLog.push(z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds())+' '+msg);
  if (diagLog.length > 4) diagLog = diagLog.slice(-4);
  diagEl.textContent = 'отладка: ' + diagLog.join(' | ');
}

/* Тихий случай (тот же канал): openTelegramLink навигацию в ФОНЕ выполняет
   корректно — подтверждено инспектором Safari (MyRadio, 08.07.2026) —,
   но видимого перехода нет, апп остаётся поверх уже открытого поста.

   ЧЕМ ЛЕЧИМ (по официальной документации core.telegram.org/bots/webapps):
   1. openLink можно вызывать «only in response to user interaction» —
      наш прежний фолбэк из setTimeout через 1.5 с этот контракт нарушал,
      поэтому Telegram его молча отбрасывал (а на iOS openLink ещё и
      всегда открывает внешний Safari — Telegram-iOS issue #1670).
   2. Документированный WebApp.close() контракт не нарушает: закрытие
      аппа выводит на экран уже открытый в фоне пост (ровно то, что
      зафиксировано инспектором в MyRadio). */
var TG_LINK_FALLBACK_MS = 1500;
function openInTelegram(url){
  var settled = false;
  function onVisChange(){
    if (document.hidden){
      settled = true;
      document.removeEventListener('visibilitychange', onVisChange);
      diagNote('апп свернулся — пост открыт, возврат свайпом');
    }
  }
  document.addEventListener('visibilitychange', onVisChange);
  try { tg.openTelegramLink(url); diagNote('openTelegramLink отправлен'); }
  catch(e){ diagNote('openTelegramLink ошибка: ' + (e && e.message ? e.message : '?')); }
  setTimeout(function(){
    document.removeEventListener('visibilitychange', onVisChange);
    if (settled) return;
    if (tg.platform === 'ios' && tg.close){
      diagNote('за 1.5с не свернулся → close() (пост уже открыт в фоне)');
      try { tg.close(); } catch(e){}
      /* последняя страховка, если close не поддержан клиентом */
      setTimeout(function(){
        if (!settled && tg.openLink){
          diagNote('close не сработал → openLink');
          try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
        }
      }, 800);
    } else if (tg.openLink){
      diagNote('за 1.5с не свернулся → openLink');
      try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
    }
  }, TG_LINK_FALLBACK_MS);
}
function openPost(url){
  if (!url) return;
  if (!tg){
    /* вне мини-аппа: во встроенном браузере Telegram target="_blank" и
       window.open молча блокируются (WKWebView не умеет новых вкладок) —
       спасает переход в той же вкладке; обычный десктоп-браузер откроет
       новую вкладку штатно */
    if (iOS) { diagNote('tg нет → переход location.href (пост может открыться под окном)'); window.location.href = url; return; }
    window.open(url, '_blank');
    return;
  }
  var plat = tg.platform || '';
  /* Telegram Web (web/weba) — в новой вкладке браузера (как в MyRadio) */
  if (plat === 'web' || plat === 'weba') { window.open(url, '_blank'); return; }
  /* родные приложения (десктоп, macOS, iOS, Android) — переход сразу
     внутрь Telegram через openTelegramLink, без внешнего браузера */
  var NATIVE_APP_PLATFORMS = {tdesktop:1, macos:1, ios:1, android:1, android_x:1};
  var canUseTelegramLink = !!tg.openTelegramLink
    && (!tg.isVersionAtLeast || tg.isVersionAtLeast('7.0'));
  if (NATIVE_APP_PLATFORMS[plat] && canUseTelegramLink) {
    openInTelegram(url);
    return;
  }
  /* необычная/неопознанная платформа или клиент старше Bot API 7.0 —
     страховка прежним openLink(): гарантированно видимый рабочий путь */
  try { tg.openLink(url, {try_instant_view:false}); } catch(e){}
}

/* ── лицензия: sha256(licensee|salt) первые 16 hex = ключ ── */
function hex(buf){
  var out = '';
  new Uint8Array(buf).forEach(function(b){ out += ('0'+b.toString(16)).slice(-2); });
  return out;
}
function licenseValid(licensee, key){
  if (!licensee || !key) return Promise.resolve(false);
  var data = new TextEncoder().encode(String(licensee).trim().toLowerCase() + '|' + SALT);
  if (!(window.crypto && crypto.subtle)) return Promise.resolve(false); // file:// — просто показываем баннер
  return crypto.subtle.digest('SHA-256', data).then(function(d){
    return ('SZ-' + hex(d).slice(0,16)).toUpperCase() === String(key).trim().toUpperCase();
  });
}

/* ── утилиты ── */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function dayLabel(iso){
  var d = new Date(iso + 'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  var yst = new Date(today.getTime() - 86400000);
  var t = new Date(d.getTime());
  if (t.getTime() === today.getTime()) return 'Сегодня';
  if (t.getTime() === yst.getTime()) return 'Вчера';
  var now = new Date();
  var label = d.getDate() + ' ' + MONTHS[d.getMonth()];
  if (d.getFullYear() !== now.getFullYear()) label += ' ' + d.getFullYear();
  return label;
}
function normTag(s){ return String(s||'').replace(/^#/,'').toLowerCase(); }

/* ── состояние приложения ── */
var POSTS = [];        // все посты (новые сверху)
var TAGS = [];         // [{tag, n}]
var TOPICS = null;     // [{id,title,icon,tags[]}] из topics.json (может не быть)
var view = 'feed';     // 'toc' | 'feed'
var filterTopic = null;// id выбранной темы (режим тем)
var filterMode = null; // универсальная группировка: 'months' | 'alpha' | 'kind' | 'topics'
var tocGroup = null;   // выбранная группа внутри filterMode
var filterTag = null;  // выбранный тег-фильтр (в виде «Лента»)
var filterQ = '';      // поисковая строка
var shown = PAGE_SIZE;

function topicOf(p){
  if (!TOPICS) return null;
  var pt = (p.tags||[]).map(normTag);
  for (var i = 0; i < TOPICS.length; i++){
    var tt = TOPICS[i].tags || [];
    for (var j = 0; j < tt.length; j++){
      if (pt.indexOf(normTag(tt[j])) !== -1) return TOPICS[i].id;
    }
  }
  return null;
}

/* ── универсальная группировка: месяцы / алфавит / тип постов ── */
var MODES = [
  {id:'months', icon:'📅', title:'По месяцам'},
  {id:'alpha',  icon:'🔤', title:'По алфавиту'},
  {id:'kind',   icon:'🎭', title:'По типу постов'}
];
var KIND_META = {
  text:{icon:'📝', title:'Тексты'}, photo:{icon:'📷', title:'Фото'},
  video:{icon:'🎬', title:'Видео'}, audio:{icon:'🎧', title:'Аудио'},
  poll:{icon:'📊', title:'Опросы'}, file:{icon:'📎', title:'Файлы'},
  sticker:{icon:'🎭', title:'Стикеры'}
};
function kindOf(p){
  if (p.kind && KIND_META[p.kind]) return p.kind;
  var t = p.title || '';
  if (t.indexOf('📷') === 0) return 'photo';
  if (t.indexOf('🎬') === 0) return 'video';
  if (t.indexOf('🎧') === 0) return 'audio';
  if (t.indexOf('📊') === 0) return 'poll';
  if (t.indexOf('📎') === 0) return 'file';
  return 'text';
}
function groupKey(p, mode){
  var md = mode || filterMode;
  if (md === 'months') return (p.date || '').slice(0,7);
  if (md === 'alpha'){
    var t = (p.title || '').replace(/^[^0-9a-zа-яё]+/i, '');
    return (t.charAt(0) || '#').toUpperCase();
  }
  return kindOf(p);
}
function monthLabel(ym){
  var m = parseInt(ym.slice(5,7), 10);
  return (MONTHS_NOM[m-1] || ym) + ' ' + ym.slice(0,4);
}
function groupCards(mode){
  var counts = {};
  POSTS.forEach(function(p){
    var k = groupKey(p, mode); if (!k) k = '#';
    if (!counts[k]) counts[k] = {key:k, n:0};
    counts[k].n++;
  });
  var arr = Object.keys(counts).map(function(k){ return counts[k]; });
  if (mode === 'months') arr.sort(function(a,b){ return a.key < b.key ? 1 : -1; });
  else if (mode === 'kind') arr.sort(function(a,b){ return b.n - a.n; });
  else arr.sort(function(a,b){ return a.key > b.key ? 1 : (a.key < b.key ? -1 : 0); });
  return arr;
}
function groupLabel(k){
  if (filterMode === 'months') return monthLabel(k);
  if (filterMode === 'kind') return (KIND_META[k] || {title:'Тексты'}).title;
  return 'На «' + k + '»';
}
function groupIcon(k){
  if (filterMode === 'months') return '📅';
  if (filterMode === 'kind') return (KIND_META[k] || {icon:'📝'}).icon;
  return k; // алфавит: буква сама — иконка
}

/* ── «По темам» (v54): счётчик для карточки в корне.
   Если темы из topics.json покрывают посты — считаем карточки тем
   (+ «Разное»), иначе — число тегов постов. */
function topicCardCount(){
  if (TOPICS){
    var n = 0, covered = 0;
    TOPICS.forEach(function(t){
      var c = 0;
      POSTS.forEach(function(p){ if (topicOf(p) === t.id) c++; });
      if (c) n++;
      covered += c;
    });
    if (covered > 0){
      var misc = POSTS.length - covered, total = n + (misc > 0 ? 1 : 0);
      return { n: total, word: pluralWord(total, ['тема','темы','тем']) };
    }
  }
  return { n: TAGS.length, word: pluralWord(TAGS.length, ['тег','тега','тегов']) };
}

/* ── фильтрация и рендер ── */
function pluralWord(n, forms){
  var a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return forms[0];
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return forms[1];
  return forms[2];
}
function plural(n){ return pluralWord(n, ['пост','поста','постов']); }
function filtered(){
  var q = filterQ.trim().toLowerCase();
  var inToc = view === 'toc' && !filterQ.trim();
  return POSTS.filter(function(p){
    if (inToc && filterTopic){
      var t = topicOf(p) || '__misc';
      if (t !== filterTopic) return false;
    } else if (inToc && filterMode && tocGroup){
      if (groupKey(p) !== tocGroup) return false;
    } else if (filterTag && !(p.tags||[]).some(function(t){ return normTag(t) === filterTag; })) return false;
    if (!q) return true;
    var hay = ((p.title||'') + ' ' + (p.preview||'') + ' ' + (p.tags||[]).join(' ')).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}

    });
  });
  var more = document.getElementById('moreBtn');
  if (more) more.style.display = 'none';
}
function renderList(items){
  var list = document.getElementById('list');
  var html = '', lastDay = '', groupOpen = false;
  items.slice(0, shown).forEach(function(p){
    if (p.date !== lastDay){
      if (groupOpen){ html += '</div>'; }
      html += '<div class="day">' + esc(dayLabel(p.date)) + '</div><div class="group">';
      lastDay = p.date; groupOpen = true;
    }
    var tags = (p.tags||[]).map(function(t){ return '<span class="c-tag">' + esc(t) + '</span>'; }).join('');
    html += '<a class="card"' + (p.url ? ' href="' + esc(p.url) + '" target="_blank" rel="noopener"' : '') + '>' +
              '<div class="c-top">' +
                (p.time ? '<span class="c-time">' + esc(p.time) + '</span>' : '') +
                '<span class="c-title">' + esc(p.title || 'Пост') + '</span>' +
              '</div>' +
              (p.preview ? '<div class="c-prev">' + esc(p.preview) + '</div>' : '') +
              (tags ? '<div class="c-tags">' + tags + '</div>' : '') +
            '</a>';
  });
  if (groupOpen) html += '</div>';
  list.innerHTML = html;
  list.querySelectorAll('a.card[href]').forEach(function(el){
    el.addEventListener('click', function(ev){
      if (ev.metaKey || ev.ctrlKey) return;   // ctrl/⌘+клик — новая вкладка силами браузера
      haptic('light');
      // мини-апп → openPost: переход внутрь Telegram, а при тихом сбое iOS
      // (мини-апп открыт из того же канала) — видимый фолбэк через браузер;
      // десктоп-браузер без tg → НЕ перехватываем: работает настоящий href
      if (tg || iOS) {
        ev.preventDefault();
        /* мгновенный визуальный отклик, пока Telegram выполняет переход
           (до 1.5 с) — тап не кажется «провисшим» (опыт MyRadio) */
        el.classList.add('pressed');
        setTimeout(function(){ el.classList.remove('pressed'); }, 300);
        openPost(el.getAttribute('href'));
      }
    });
  });
  var more = document.getElementById('moreBtn');
  if (items.length > shown){
    if (!more){
      more = document.createElement('button');
      more.id = 'moreBtn'; more.className = 'more';
      more.onclick = function(){ haptic('light'); shown += PAGE_SIZE; render(); };
      document.getElementById('list').after(more);
    }
    more.textContent = 'Показать ещё (' + (items.length - shown) + ')';
    more.style.display = 'block';
  } else if (more){ more.style.display = 'none'; }
}
function renderState(kind, extra){
  var st = document.getElementById('state');
  var list = document.getElementById('list');
  var more = document.getElementById('moreBtn');
  if (more) more.style.display = 'none';
  if (!kind){ st.style.display = 'none'; list.style.display = ''; return; }
  list.style.display = 'none';
  st.style.display = 'block';
  if (kind === 'empty')   st.innerHTML = '<div class="big">📭</div><div class="t">Пока пусто</div><div>Посты появятся здесь сразу после первой публикации или импорта.</div>';
  if (kind === 'nomatch') st.innerHTML = '<div class="big">🔍</div><div class="t">Ничего не найдено</div><div>Попробуйте изменить запрос или выбрать другую тему.</div>';
  if (kind === 'error'){
    document.getElementById('chips').style.display = 'none';
    st.innerHTML = '<div class="big">⚠️</div><div class="t">Не удалось загрузить оглавление</div><div>' + esc(extra||'') + '</div>'
      + '<button type="button" class="more" id="retryBtn" style="max-width:220px;margin:18px auto 0">Повторить</button>';
    var rb = document.getElementById('retryBtn');
    if (rb) rb.onclick = function(){ haptic('light'); load(); loadTopics(); };
  }
}
function render(){
  var items = filtered();
  var q = filterQ.trim();
  var inToc = view === 'toc' && !q;
  var sub = POSTS.length ? ('каталог постов · ' + POSTS.length + ' шт.') : 'каталог постов канала';
  if (inToc && filterMode && filterMode !== 'topics' && !tocGroup){
    var gn = groupCards().length;
    sub = gn + ' ' + pluralWord(gn, ['раздел','раздела','разделов']);
  } else if (inToc && filterMode === 'topics' && !filterTopic && !filterTag){
    var tc = topicCardCount();
    sub = tc.n + ' ' + tc.word;
  }
  document.getElementById('hSub').textContent = sub;
  renderViews();
  document.getElementById('chips').style.display = inToc ? 'none' : '';
  if (!POSTS.length){ renderChips(); return renderState('empty'); }
  if (inToc && !filterMode && !filterTopic && !tocGroup && !filterTag){ renderModeGrid(); return; }  // v54 корень: 4 карточки
  if (inToc && filterMode === 'topics' && !filterTopic && !filterTag){ renderTopicsScreen(); return; }
  if (inToc && filterMode && filterMode !== 'topics' && !tocGroup){ renderGroupCards(); return; }
  if (inToc && filterTopic){
    showBack('← Темам', function(){ filterTopic = null; shown = PAGE_SIZE; render(); });
  } else if (inToc && filterMode && tocGroup){
    showBack('← Разделы', function(){ tocGroup = null; shown = PAGE_SIZE; render(); });
  } else if (inToc && filterTag){
    showBack('← Темам', function(){ filterTag = null; shown = PAGE_SIZE; render(); });
  } else { hideBack(); }
  renderChips();
  if (!items.length) return renderState('nomatch');
  renderState(null);
  renderList(items);
  document.getElementById('list').style.display = '';
}

/* ── поиск ── */
var qEl = document.getElementById('q'), clrEl = document.getElementById('clr');
qEl.addEventListener('input', function(){
  filterQ = qEl.value; shown = PAGE_SIZE;
  clrEl.style.display = qEl.value ? 'block' : 'none';
  render();
});
clrEl.addEventListener('click', function(){
  haptic('light');
  qEl.value = ''; filterQ = ''; clrEl.style.display = 'none'; shown = PAGE_SIZE; render(); qEl.focus();
});

/* ── переключатель вида: Оглавление / Лента ── */
document.getElementById('vToc').addEventListener('click', function(){
  hapticSelect();
  view = 'toc'; filterTopic = null; filterTag = null; filterMode = null; tocGroup = null; shown = PAGE_SIZE; render();
});
document.getElementById('vFeed').addEventListener('click', function(){
  hapticSelect();
  view = 'feed'; filterTopic = null; filterTag = null; filterMode = null; tocGroup = null; shown = PAGE_SIZE; render();
});

/* ── загрузка данных ── */
var RAW_TOPICS = null;    // содержимое topics.json (если есть)
var POSTS_READY = false;  // posts.json загружен
function tryApplyTopics(){
  if (!RAW_TOPICS || !POSTS_READY) return;
  var ts = (RAW_TOPICS && RAW_TOPICS.topics) || [];
  TOPICS = ts.filter(function(t){ return t && t.id && (t.tags||[]).length; });
  if (!TOPICS.length) TOPICS = null;
  render();   // v54: темы живут внутри карточки «По темам» — корень всегда одинаков
}
function loadTopics(){
  fetch('topics.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){ RAW_TOPICS = data; tryApplyTopics(); })
    .catch(function(){ if (POSTS_READY) render(); });   // topics.json нет/недоступен — остаётся текущий вид
}
function boot(data){
  var posts = Array.isArray(data) ? data : (data.posts || []);
  POSTS = posts.map(function(p){
    var d = String(p.date || '');
    return {
      date: d.slice(0,10), time: String(p.time || (d.length > 10 ? d.slice(11,16) : '')),
      title: p.title || '', preview: p.preview || '',
      tags: p.tags || [], kind: p.kind || '', url: p.url || ''
    };
  }).sort(function(a,b){
    var ka = a.date + ' ' + a.time, kb = b.date + ' ' + b.time;
    return ka < kb ? 1 : (ka > kb ? -1 : 0);
  });
  if (!POSTS_READY && cfg.default_view !== 'feed') view = 'toc';   // вид по умолчанию — только при первой загрузке
  var counts = {};
  POSTS.forEach(function(p){ (p.tags||[]).forEach(function(t){
    var k = normTag(t); if (!k) return;
    if (!counts[k]) counts[k] = {tag: t, n: 0};
    counts[k].n++;
  });});
  TAGS = Object.keys(counts).map(function(k){ return counts[k]; })
    .sort(function(a,b){ return b.n - a.n; });
  POSTS_READY = true;
  render();
  tryApplyTopics();
}

/* ── загрузка данных: мгновенный старт из кэша + тихое обновление ──
   posts.json сохраняется в localStorage после каждой успешной загрузки:
   при медленной сети оглавление открывается мгновенно (сохранённая
   копия), затем тихо обновляется; без сети показывается копия. */
var CACHE_KEY = 'sz_posts_v1';
function cacheRead(){
  try {
    var o = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    return (o && typeof o.raw === 'string') ? o : null;
  } catch(e){ return null; }
}
function stampFresh(t){
  if (!t) return;
  var el = document.getElementById('fresh');
  if (!el){
    el = document.createElement('div');
    el.className = 'lic'; el.id = 'fresh';
    var f = document.querySelector('footer');
    if (f) f.insertBefore(el, document.getElementById('licLine'));
  }
  var d = new Date(t), z = function(x){ return ('0' + x).slice(-2); };
  el.textContent = 'данные обновлены: ' + z(d.getDate()) + '.' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
function bootFromCache(){
  var cached = cacheRead();
  if (!cached) return null;
  try {
    var cd = JSON.parse(cached.raw);
    var cn = Array.isArray(cd) ? cd.length : ((cd && cd.posts) ? cd.posts.length : 0);
    if (cn) { boot(cd); stampFresh(cached.t); }   // пустой кэш не показываем — пусть решает сеть
    return cached;
  } catch(e){ return null; }
}
function load(){
  var cached = bootFromCache();
  fetch('posts.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(txt){
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({t: Date.now(), raw: txt})); } catch(e){}
      if (cached && txt === cached.raw){ stampFresh(Date.now()); return; }   // данные не изменились
      boot(JSON.parse(txt));
      stampFresh(Date.now());
    })
    .catch(function(e){
      if (!POSTS_READY) renderState('error', 'Файл posts.json недоступен или пуст. Проверьте настройку по гайду (' + e.message + ').');
    });
}

  }
});
load();
loadTopics();
