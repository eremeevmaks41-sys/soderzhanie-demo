# ═══════════════════════════════════════════════════════════════
# «Содержание» · новостной конвейер v2 (ИИ-карточки)
# Каждые 2 часа: RSS/видео → ИИ-карточка → канал → оглавление (≤10 постов
# в сутки). Каждый публикационный запуск ещё и сверяет оглавление с
# каналом — посты, удалённые в Telegram, вычищаются из posts.json.
# Требует секреты (Settings → Secrets and variables → Actions):
#   BOT_TOKEN, CHANNEL_USERNAME, GROQ_API_KEY (openrouter.ai, бесплатно)
# Запуск вручную: вкладка Actions → «Новостной конвейер» → Run
#   dry_run=true   — показать карточки без публикации
#   sync_only=true — только сверка оглавления (без новых постов)
# ═══════════════════════════════════════════════════════════════
name: Новостной конвейер

on:
  schedule:
    # каждые 2 часа: 00:07 / 02:07 / … / 22:07 UTC (≈ 1–2 поста за запуск)
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Сколько новостей опубликовать за запуск (по умолчанию 1)"
        required: false
        default: "1"
      dry_run:
        description: "Только показать новости, не публиковать (true/false)"
        required: false
        default: "false"
      sync_only:
        description: "Только сверка оглавления с каналом: вычистить удалённые посты, ничего не публикуя"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Скрипты работают на чистом Python (stdlib) — pip-зависимости не нужны

      - name: Только сверка оглавления (без публикаций)
        if: ${{ inputs.sync_only == 'true' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: python pipeline/news_pipeline.py --mode publish --max 0

      - name: Конвейер (публикация + обновление оглавления)
        if: ${{ inputs.dry_run != 'true' && inputs.sync_only != 'true' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pipeline/news_pipeline.py --mode publish --max ${{ inputs.max_posts || '1' }} --daily-cap 10

      - name: Конвейер (пробный запуск без публикации)
        if: ${{ inputs.dry_run == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python pipeline/news_pipeline.py --mode dry --max ${{ inputs.max_posts || '3' }}

      - name: Коммит обновлённого оглавления
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "soderzhanie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/posts.json pipeline/seen.json
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
          else
            git commit -m "новости: обновлено оглавление [skip ci]"
            git push
          fi
