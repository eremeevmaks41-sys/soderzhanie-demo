# ═══════════════════════════════════════════════════════════════
# «Содержание» · новостной конвейер
# 4 раза в сутки: RSS → анонс в канал → обновление оглавления.
# Требует секреты: BOT_TOKEN, CHANNEL_USERNAME (Settings → Secrets).
# Запуск вручную: вкладка Actions → «Новостной конвейер» → Run.
# ═══════════════════════════════════════════════════════════════
name: Новостной конвейер

on:
  schedule:
    # 05:23 / 11:23 / 17:23 / 23:23 по Москве (UTC+3 вычтен)
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Сколько новостей опубликовать за запуск (по умолчанию 3)"
        required: false
        default: "3"
      dry_run:
        description: "Только показать новости, не публиковать (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Скрипты работают на чистом Python (stdlib) — pip-зависимости не нужны

      - name: Конвейер (публикация + обновление оглавления)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: python pipeline/news_pipeline.py --mode publish --max ${{ inputs.max_posts || '3' }}

      - name: Конвейер (пробный запуск без публикации)
        if: ${{ inputs.dry_run == 'true' }}
        run: python pipeline/news_pipeline.py --mode dry --max ${{ inputs.max_posts || '3' }}

      - name: Коммит обновлённого оглавления
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "soderzhanie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/posts.json pipeline/seen.json
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
          else
            git commit -m "новости: обновлено оглавление [skip ci]"
            git push
          fi
